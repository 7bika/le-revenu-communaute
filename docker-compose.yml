# Lancement complet : PostgreSQL + Strapi + Next.js
#   docker compose up --build
# Front : http://localhost:3000 · API / back-office : http://localhost:1337/admin
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lerevenu
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U strapi -d lerevenu']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: lerevenu
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      # Secrets de démonstration uniquement : à remplacer en dehors d'un poste local
      APP_KEYS: ${APP_KEYS:-demoKey1,demoKey2,demoKey3,demoKey4}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-demoApiTokenSalt}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-demoAdminJwtSecret}
      JWT_SECRET: ${JWT_SECRET:-demoJwtSecret}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-demoTransferTokenSalt}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-demoEncryptionKey}
      CORS_ORIGINS: http://localhost:3000
      SEED_DEMO_DATA: 'true'
      DEMO_USER_PASSWORD: Demo1234!
      ADMIN_EMAIL: admin@lerevenu.local
      ADMIN_PASSWORD: Admin1234!
    ports:
      - '1337:1337'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:1337/_health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      STRAPI_URL: http://backend:1337
      SHOW_DEMO_ACCOUNTS: 'true'
      # Le front est servi en HTTP en local : cookie de session sans l'attribut Secure
      COOKIE_SECURE: 'false'
    ports:
      - '3000:3000'

volumes:
  pgdata:
